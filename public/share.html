<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>ผลตรวจสัญญาที่แชร์ให้คุณ · Vellum Check</title>
<meta property="og:title" content="ผลตรวจสัญญาที่แชร์ให้คุณ · Vellum Check">
<meta property="og:description" content="ดูจุดที่ควรระวังและสิ่งที่ควรขอแก้ก่อนเซ็น · อ่านอย่างเดียว · ลิงก์หมดอายุใน 7 วัน">
<meta property="og:image" content="/i-45cf9620.png">
<meta name="theme-color" content="#0b0c0f">
<link rel="apple-touch-icon" sizes="180x180" href="/i-45cf9620.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0c0f;--card:#15171c;--line:rgba(255,255,255,.08);--tx:#ececef;--mu:#9a9aa3;--hi:#f2555a;--md:#f5c451;--lo:#8d8d96;--bl:#7fb5ff}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Prompt,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background:radial-gradient(900px 500px at 50% -10%,rgba(127,181,255,.12),transparent 60%),var(--bg)}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:10px;padding:16px 0}
  header svg{width:30px;height:30px}
  header b{font:600 16px/1 Prompt;letter-spacing:.06em}
  header a{margin-left:auto;padding:9px 14px;border-radius:99px;background:#f3ecdc;color:#1b1710;font:600 13px/1 Prompt;text-decoration:none}
  .ban{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;border:1px solid rgba(127,181,255,.28);background:rgba(127,181,255,.07)}
  .ban i{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgba(127,181,255,.16);font-style:normal;font-size:18px}
  .ban b{display:block;font:600 14.5px/1.35 Prompt}.ban small{display:block;margin-top:2px;font:400 12.5px/1.5 Prompt;color:#a9b8d0}
  .hd{margin:22px 2px 14px}.hd p{margin:0;font:600 12px/1 Prompt;letter-spacing:.12em;color:var(--mu)}
  .hd h1{margin:8px 0 4px;font:700 26px/1.25 Prompt}.hd span{font:400 13px/1.5 Prompt;color:var(--mu)}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
  .sum div{padding:12px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
  .sum b{display:block;font:700 24px/1.1 Prompt;color:var(--c)}.sum small{font:500 12px/1.3 Prompt;color:var(--mu)}
  .it{position:relative;margin-bottom:10px;padding:14px 14px 14px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
  .it::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .tg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 12px/1.3 Prompt;color:var(--c)}
  .tg em{font-style:normal;color:var(--mu);font-weight:500}
  .it h3{margin:8px 0 6px;font:700 16.5px/1.4 Prompt}
  .it p{margin:0;font:400 14px/1.7 Prompt;color:#c9c9cf}
  .q{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:#f3ecdc;color:#2a251b;font:400 14px/1.65 Sarabun,Prompt}
  .fx{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.22)}
  .fx b{display:block;font:600 12.5px/1.3 Prompt;color:#6ee7b7;margin-bottom:3px}.fx span{font:400 13.5px/1.65 Prompt;color:#d9f5ea}
  .ms{margin:20px 0 10px;padding:14px;border-radius:16px;background:var(--card);border:1px dashed rgba(127,181,255,.3)}
  .ms h2{margin:0 0 8px;font:700 15px/1.3 Prompt}.ms ul{margin:0;padding-left:20px}.ms li{font:400 14px/1.8 Prompt;color:#c9c9cf}
  .disc{margin:18px 2px;font:400 12px/1.6 Prompt;color:#71717a}
  .cta{display:block;margin-top:20px;padding:18px;border-radius:18px;text-decoration:none;color:var(--tx);background:linear-gradient(135deg,rgba(245,196,81,.14),rgba(127,181,255,.08));border:1px solid rgba(245,196,81,.3)}
  .cta b{display:block;font:700 17px/1.35 Prompt}.cta small{display:block;margin:4px 0 12px;font:400 13px/1.5 Prompt;color:#c4c4cb}
  .cta span{display:inline-block;padding:11px 18px;border-radius:12px;background:#f3ecdc;color:#1b1710;font:700 14px/1 Prompt}
  .st{padding:60px 10px;text-align:center}.st i{display:block;font-style:normal;font-size:42px;margin-bottom:10px}.st b{display:block;font:700 18px/1.4 Prompt}.st small{display:block;margin-top:6px;color:var(--mu);font:400 14px/1.6 Prompt}
  .sk{height:110px;margin-bottom:10px;border-radius:16px;background:linear-gradient(90deg,#15171c,#1d2027,#15171c);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5L54 13V32C54 46 44 54 32 59C20 54 10 46 10 32V13Z" fill="#c9ced6"/><path d="M22 32L29 39L43 24" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <b>Vellum Check</b>
    <a href="/">ตรวจสัญญาของคุณ</a>
  </header>
  <main id="app"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
</div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var id = (location.pathname.match(/\/s\/([A-Za-z0-9_-]+)/) || [])[1] || new URLSearchParams(location.search).get('id') || '';
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var LV = { check_detail: ['ตรวจละเอียด', 'var(--hi)'], caution: ['ควรระวัง', 'var(--md)'], low: ['ข้อสังเกต', 'var(--lo)'] };
  function d(x) { try { return new Date(x).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } }
  var CTA = '<a class="cta" href="/"><b>มีสัญญาที่ต้องเซ็นเหมือนกัน?</b><small>วางข้อความสัญญา แล้วดูจุดที่ควรระวังก่อนเซ็น · ลองตัวอย่างได้ฟรี</small><span>ตรวจสัญญาของคุณ →</span></a>';
  function state(ic, t, s) { app.innerHTML = '<div class="st"><i>' + ic + '</i><b>' + esc(t) + '</b><small>' + esc(s) + '</small></div>' + CTA; }
  if (!id) { state('🔗', 'ลิงก์ไม่ถูกต้อง', 'ตรวจดูว่าคัดลอกลิงก์มาครบหรือไม่'); return; }
  fetch('/api/share/' + encodeURIComponent(id), { credentials: 'omit' }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, s: r.status, j: j }; }); }).then(function (x) {
    if (!x.ok) { state(x.s === 410 ? '⌛' : '🔒', x.j && x.j.error || 'เปิดลิงก์ไม่สำเร็จ', x.s === 410 ? 'ขอให้คนที่ส่งลิงก์สร้างลิงก์ใหม่ให้' : 'ลิงก์อาจถูกยกเลิกแล้ว'); return; }
    var R = x.j.result || {}, items = R.items || [], c = R.counts || {};
    var h = '<div class="ban"><i>👀</i><div><b>มีคนแชร์ผลตรวจสัญญานี้ให้คุณดู</b><small>อ่านอย่างเดียว · ข้อมูลส่วนตัวถูกปิดบังแล้ว · ลิงก์ใช้ได้ถึง ' + esc(d(x.j.expiresAt)) + '</small></div></div>';
    h += '<div class="hd"><p>ANALYSIS REPORT</p><h1>' + esc(R.title || 'ผลการตรวจสอบสัญญา') + '</h1><span>' + (R.typeText ? 'ประเภทเอกสาร: ' + esc(R.typeText) + ' · ' : '') + 'สร้างเมื่อ ' + esc(d(x.j.createdAt)) + '</span></div>';
    h += '<div class="sum"><div style="--c:var(--hi)"><b>' + (c.check_detail || 0) + '</b><small>ตรวจละเอียด</small></div><div style="--c:var(--md)"><b>' + (c.caution || 0) + '</b><small>ควรระวัง</small></div><div style="--c:var(--lo)"><b>' + (c.low || 0) + '</b><small>ข้อสังเกต</small></div></div>';
    h += items.map(function (it, i) {
      var L = LV[it.level] || LV.low, fx = it.suggested_fix || it.how_to_negotiate;
      return '<article class="it" style="--c:' + L[1] + '"><div class="tg">● ' + L[0] + (it.topic ? ' <em>· ' + esc(it.topic) + '</em>' : '') + '</div><h3>' + (i + 1) + '. ' + esc(it.title) + '</h3>' +
        (it.explanation ? '<p>' + esc(it.explanation) + '</p>' : '') +
        (it.quote ? '<div class="q">“' + esc(it.quote) + '”</div>' : '') +
        (fx ? '<div class="fx"><b>' + (it.suggested_fix ? 'สิ่งที่ควรขอแก้ไข' : 'ขั้นตอนถัดไป') + '</b><span>' + esc(fx) + '</span></div>' : '') + '</article>';
    }).join('');
    if (R.missing && R.missing.length) h += '<section class="ms"><h2>เรื่องที่สัญญายังไม่ได้ระบุ</h2><ul>' + R.missing.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></section>';
    h += '<p class="disc">ผลตรวจจาก AI เพื่อช่วยคัดกรองเบื้องต้น ไม่ใช่คำปรึกษาทางกฎหมาย' + (R.quotes === false ? ' · ผู้แชร์เลือกไม่แสดงข้อความจากสัญญา' : '') + '</p>' + CTA;
    app.innerHTML = h;
    document.title = (R.title || 'ผลตรวจสัญญา') + ' · Vellum Check';
  }).catch(function () { state('📶', 'เปิดลิงก์ไม่สำเร็จ', 'ตรวจสอบอินเทอร์เน็ต แล้วลองใหม่อีกครั้ง'); });
})();
</script>
</body>
</html>
